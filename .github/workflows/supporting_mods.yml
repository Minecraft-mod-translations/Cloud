name: Generate and Commit Mods Table

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
  push:
    branches: [ main ]
    paths: [ '**.json' ]

jobs:
  generate-mods-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || 'main' }}
        fetch-depth: 0  # Полная история коммитов для корректной работы git diff

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Generate mods table
      id: generate
      run: |
        python - <<EOF
        import json
        import os
        from collections import defaultdict

        # Load the list of supported mod hashes
        with open('list.json') as f:
            supported_hashes = set(json.load(f)['lists'])

        # Find all JSON files in the repository (excluding list.json)
        mod_files = []
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.json') and file != 'list.json' and not file.startswith('.'):
                    mod_files.append(os.path.join(root, file))

        # Process all mod files
        mods_data = defaultdict(list)
        for mod_file in mod_files:
            try:
                with open(mod_file) as f:
                    mod_data = json.load(f)
                    if 'name' in mod_data and 'version' in mod_data:
                        file_hash = os.path.basename(mod_file).replace('.json', '')
                        if file_hash in supported_hashes:
                            mods_data[mod_data['name']].append(mod_data['version'])
            except (json.JSONDecodeError, UnicodeDecodeError) as e:
                print(f"Skipping {mod_file}: {str(e)}")
                continue

        # Generate markdown table
        markdown = "## Supported Mods\n\n"
        markdown += "| Mod Name | Supported Versions |\n"
        markdown += "|----------|--------------------|\n"
        
        for name, versions in sorted(mods_data.items()):
            versions_str = ", ".join(sorted(set(versions)))
            markdown += f"| {name} | {versions_str} |\n"

        # Write to file
        with open('SUPPORTED_MODS.md', 'w', encoding='utf-8') as f:
            f.write(markdown)
        
        print(f"Generated table with {len(mods_data)} mods")
        EOF

    - name: Commit and push changes
      run: |
        # Проверяем, есть ли изменения
        if git diff --quiet --exit-code; then
          echo "No changes to commit"
        else
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add SUPPORTED_MODS.md
          git commit -m "Auto-update: Supported Mods Table [skip ci]"
          git push
        fi
