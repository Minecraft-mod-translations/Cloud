name: Generate and Commit Mods Table

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
  push:
    branches: [ main ]
    paths: [ '**.json' ]

jobs:
  generate-mods-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || 'main' }}
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Generate mods table
      id: generate
      run: |
        python - <<EOF
        import json
        import os
        from collections import defaultdict

        with open('list.json') as f:
            supported_hashes = set(json.load(f)['lists'])

        mod_files = []
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.json') and file != 'list.json':
                    mod_files.append(os.path.join(root, file))

        mods_data = defaultdict(list)
        for mod_file in mod_files:
            try:
                with open(mod_file) as f:
                    mod_data = json.load(f)
                    if 'name' in mod_data and 'version' in mod_data:
                        file_hash = os.path.basename(mod_file).replace('.json', '')
                        if file_hash in supported_hashes:
                            mods_data[mod_data['name']].append(mod_data['version'])
            except Exception as e:
                print(f"Skipping {mod_file}: {str(e)}")

        markdown = "## Supported Mods\n\n| Mod Name | Supported Versions |\n|----------|--------------------|\n"
        for name, versions in sorted(mods_data.items()):
            versions_str = ", ".join(sorted(set(versions)))
            markdown += f"| {name} | {versions_str} |\n"

        with open('SUPPORTED_MODS.md', 'w', encoding='utf-8') as f:
            f.write(markdown)
        
        print(f"Generated table with {len(mods_data)} mods")
        EOF

    - name: Verify file exists
      run: |
        if [ ! -f "SUPPORTED_MODS.md" ]; then
          echo "::error::SUPPORTED_MODS.md was not generated!"
          exit 1
        else
          echo "File SUPPORTED_MODS.md exists"
          cat SUPPORTED_MODS.md
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        git add SUPPORTED_MODS.md
        
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update: Supported Mods Table [skip ci]"
          git pull --rebase
          git push origin HEAD:${{ github.event.inputs.branch || 'main' }}
          echo "Changes pushed successfully"
        fi
