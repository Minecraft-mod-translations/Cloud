name: Generate and Commit Mods Table

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
  push:
    branches: [ main ]
    paths: [ '**.json' ]

jobs:
  generate-mods-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || 'main' }}
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: pip install packaging

    - name: Generate sorted mods table
      id: generate
      run: |
        python - <<EOF
        import json
        import os
        import re
        from collections import defaultdict
        from packaging import version

        def parse_version(v):
            try:
                # Обрабатываем версии типа "1.16.4 - 1.16.5"
                if ' - ' in v:
                    v = v.split(' - ')[-1]
                # Удаляем нечисловые префиксы/суффиксы
                clean_v = re.sub(r'[^0-9.]', '', v.split('-')[0].split('+')[0])
                return version.parse(clean_v)
            except:
                return version.parse("0")

        with open('list.json') as f:
            supported_hashes = set(json.load(f)['lists'])

        mod_files = []
        for root, _, files in os.walk('.'):
            for file in files:
                if file.endswith('.json') and file != 'list.json':
                    mod_files.append(os.path.join(root, file))

        mods_data = defaultdict(list)
        for mod_file in mod_files:
            try:
                with open(mod_file) as f:
                    mod_data = json.load(f)
                    if 'name' in mod_data and 'version' in mod_data:
                        file_hash = os.path.basename(mod_file).replace('.json', '')
                        if file_hash in supported_hashes:
                            mods_data[mod_data['name']].append(mod_data['version'])
            except Exception as e:
                print(f"Skipping {mod_file}: {str(e)}")

        markdown = "## Supported Mods (Newest First)\n\n"
        markdown += "| Mod Name | Supported Versions |\n"
        markdown += "|----------|--------------------|\n"

        for name in sorted(mods_data.keys(), key=lambda x: x.lower()):
            unique_versions = list(set(mods_data[name]))
            sorted_versions = sorted(
                unique_versions,
                key=parse_version,
                reverse=True
            )
            versions_str = ", ".join(sorted_versions)
            markdown += f"| {name} | {versions_str} |\n"

        with open('SUPPORTED_MODS.md', 'w', encoding='utf-8') as f:
            f.write(markdown)
        
        print(f"Generated table with {len(mods_data)} mods")
        EOF

    - name: Verify and commit changes
      run: |
        if [ ! -f "SUPPORTED_MODS.md" ]; then
          echo "::error::SUPPORTED_MODS.md was not generated!"
          exit 1
        fi
        
        echo "Generated file preview:"
        head -n 20 SUPPORTED_MODS.md

        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add SUPPORTED_MODS.md
        
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update: Supported Mods Table (proper version sorting) [skip ci]"
          git pull --rebase
          git push origin HEAD:${{ github.event.inputs.branch || 'main' }}
          echo "Changes pushed successfully"
        fi
