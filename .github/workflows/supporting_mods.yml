name: Generate Mods Table

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
      force_update:
        description: 'Force update even if no JSON changes'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [ main ]
    paths: [ '**.json' ]

jobs:
  generate-mods-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || 'main' }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Generate mods table
      run: |
        python - <<EOF
        import json
        import os
        from collections import defaultdict

        # Load the list of supported mod hashes
        with open('list.json') as f:
            supported_hashes = set(json.load(f)['lists'])

        # Find all JSON files in the repository (excluding list.json)
        mod_files = []
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.json') and file != 'list.json':
                    mod_files.append(os.path.join(root, file))

        # Process all mod files
        mods_data = defaultdict(list)
        for mod_file in mod_files:
            try:
                with open(mod_file) as f:
                    mod_data = json.load(f)
                    if 'name' in mod_data and 'version' in mod_data:
                        file_hash = os.path.basename(mod_file).replace('.json', '')
                        if file_hash in supported_hashes:
                            mods_data[mod_data['name']].append(mod_data['version'])
            except json.JSONDecodeError:
                continue

        # Generate markdown table
        markdown = "## Supported Mods\n\n"
        markdown += "| Mod Name | Supported Versions |\n"
        markdown += "|----------|--------------------|\n"
        
        for name, versions in sorted(mods_data.items()):
            versions_str = ", ".join(sorted(set(versions)))  # Remove duplicates and sort
            markdown += f"| {name} | {versions_str} |\n"

        # Write to README.md or SUPPORTED_MODS.md
        output_file = 'SUPPORTED_MODS.md'
        with open(output_file, 'w') as f:
            f.write(markdown)
        
        print(f"Generated mods table with {len(mods_data)} mods")
        EOF

    - name: Commit and push changes
      if: ${{ github.event_name == 'push' || github.event.inputs.force_update == 'true' }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add SUPPORTED_MODS.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update supported mods table" && git push)
